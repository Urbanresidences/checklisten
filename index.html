<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Urban Residences Checklisten — Alle Afdelingen</title>
<style>
  :root{
    --charcoal:#1A1A1A;
    --ink:#2B2620;
    --gold:#B08D57;
    --gold-light:#D9C7A8;
    --cream:#F3EDE3;
    --paper:#FAF9F6;
    --line:#E4DDD1;
    --open:#B08D57;
    --bezig:#6E85A0;
    --gereed:#6B7A5E;
    --nvt:#A79C8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--charcoal);
    color:var(--cream);
    display:flex;
    flex-direction:column;
    padding:24px 0;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 20px 22px 20px;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:18px;
  }
  .brand-mark{
    width:34px;height:34px;
    border:1px solid var(--gold);
    border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    font-weight:700;
    font-size:13px;
    letter-spacing:.5px;
    font-family:Georgia,serif;
  }
  .brand-text{
    font-size:11px;
    line-height:1.35;
    letter-spacing:.04em;
    color:var(--gold-light);
  }
  .brand-text strong{
    display:block;
    color:#fff;
    font-size:13px;
    font-family:Georgia,serif;
    letter-spacing:.02em;
  }
  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .tab{
    text-align:left;
    background:none;
    border:none;
    color:#C9C2B4;
    padding:11px 12px;
    font-size:14px;
    cursor:pointer;
    border-radius:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
    font-family:inherit;
  }
  .tab small{
    color:#8B8477;
    font-size:11px;
  }
  .tab:hover{background:rgba(255,255,255,.05);color:#fff;}
  .tab.active{
    background:rgba(176,141,87,.15);
    color:#fff;
    box-shadow:inset 3px 0 0 var(--gold);
  }
  .tab.active small{color:var(--gold-light);}

  .handover-tab-wrap{padding:0 10px;}
  .nav-divider{
    height:1px;
    background:rgba(255,255,255,.1);
    margin:10px 20px 10px 20px;
  }

  .admin-wrap{padding:0 10px;}
  .admin-tab{margin-top:4px;}
  .admin-only{
    display:inline-block;
    background:var(--gold);
    color:var(--charcoal);
    font-size:9px;
    font-weight:800;
    letter-spacing:.04em;
    padding:1px 5px;
    border-radius:3px;
    margin-left:4px;
    vertical-align:middle;
    text-transform:uppercase;
  }

  /* ---------- Dagoverzicht ---------- */
  .report-shift{
    border:1px solid var(--line);
    border-radius:7px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .report-shift-head{
    background:var(--cream);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .report-shift-head h3{
    margin:0;
    font-size:14px;
    color:var(--charcoal);
    flex:1;
  }
  .report-shift-stat{
    font-size:12px;
    color:#77705F;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .report-pct{
    font-size:22px;
    font-weight:700;
    color:var(--charcoal);
    min-width:50px;
    text-align:right;
  }
  .report-pct small{font-size:12px;font-weight:400;}
  .report-pct.pct-100{color:#4A8C5C;}
  .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    flex-shrink:0;
  }
  .dot.done{background:#4A8C5C;}
  .dot.nvt{background:#B0A090;}
  .dot.open{background:#C4855A;}
  .dot.notes{background:#5A7EB0;}
  .report-task-list{padding:6px 0;}
  .report-task{
    display:grid;
    grid-template-columns:18px 1fr;
    gap:4px 8px;
    align-items:start;
    padding:6px 18px;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .report-task:first-child{border-top:none;}
  .report-task-icon{padding-top:3px;}
  .report-task-title{color:var(--ink);}
  .report-task-notes{
    grid-column:2;
    font-size:11.5px;
    color:#8B8477;
    font-style:italic;
    margin-top:1px;
  }
  .report-task.has-notes .report-task-title{font-weight:600;}

  /* ---------- SOP Bibliotheek (in-file) ---------- */
  .sop-tab small{color:#8B8477;}
  .sop-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:28px;
  }
  .sop-list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px 16px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--charcoal);
    cursor:pointer;
    text-align:left;
  }
  .sop-list-item:hover{border-color:var(--gold);}
  .sop-list-item small{
    font-weight:400;
    color:#9A9284;
    font-family:Arial,sans-serif;
    font-size:11px;
  }
  .sop-doc{
    font-family:Georgia,'Times New Roman',serif;
    border-top:2px solid var(--line);
    padding-top:24px;
    margin-top:8px;
  }
  .sop-banner{
    background:var(--charcoal);
    color:var(--gold-light);
    padding:14px 20px;
    border-radius:6px;
    font-weight:700;
    font-size:15px;
    margin-bottom:6px;
  }
  .sop-sub{
    font-size:12px;
    color:#8B8477;
    margin-bottom:26px;
    font-family:Arial,sans-serif;
  }
  .sop-doc h2{
    font-size:15px;
    color:var(--charcoal);
    border-bottom:2px solid var(--gold);
    padding-bottom:5px;
    margin:28px 0 12px 0;
  }
  .sop-doc h2:first-of-type{margin-top:0;}
  .sop-doc p{line-height:1.65;font-size:14px;margin:0 0 12px 0;}
  .sop-doc ul{margin:0 0 12px 0;padding-left:20px;line-height:1.65;font-size:14px;}
  .sop-doc ul li{margin-bottom:3px;}
  .sop-callout{
    background:var(--cream);
    border-left:3px solid var(--gold);
    padding:11px 15px;
    font-size:13px;
    border-radius:0 5px 5px 0;
    margin:12px 0;
  }
  table.sop-table{
    width:100%;
    border-collapse:collapse;
    margin:8px 0 18px 0;
    font-size:12.5px;
    font-family:Arial,sans-serif;
  }
  table.sop-table th{
    background:var(--charcoal);
    color:#fff;
    text-align:left;
    padding:8px 11px;
    font-weight:600;
  }
  table.sop-table td{padding:7px 11px;border-bottom:1px solid var(--line);}
  table.sop-table tr:nth-child(even) td{background:var(--cream);}
  .sop-checklist{list-style:none;padding-left:0;}
  .sop-checklist li{
    padding:6px 0 6px 24px;
    position:relative;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .sop-checklist li::before{content:"☐";position:absolute;left:0;color:var(--gold);font-size:14px;}
  .sop-signoff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .sop-signoff div{border:1px solid var(--line);border-radius:5px;padding:11px 13px;}
  .sop-signoff label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#9A9284;font-family:Arial,sans-serif;margin-bottom:5px;}
  .sop-signoff .sop-line{border-bottom:1px solid var(--line);height:22px;}
  @media (max-width:760px){
    .sop-signoff{grid-template-columns:1fr;}
  }

  .sidebar-footer{
    margin-top:auto;
    padding:14px 20px 0 20px;
    border-top:1px solid rgba(255,255,255,.12);
    font-size:11px;
    color:#8B8477;
    line-height:1.5;
  }

  .user-badge{
    margin:0 20px 18px 20px;
    padding:10px 12px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:5px;
    font-size:12px;
    color:#C9C2B4;
    cursor:pointer;
  }
  .user-badge .lbl{font-size:10px;letter-spacing:.04em;color:#8B8477;text-transform:uppercase;display:block;margin-bottom:2px;}
  .user-badge .name{color:#fff;font-weight:600;font-size:13.5px;}
  .user-badge .switch{color:var(--gold-light);font-size:11px;margin-left:6px;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(26,26,26,.75);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
  }
  .overlay-card{
    background:#fff;
    border-radius:8px;
    padding:32px 34px;
    width:340px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .overlay-card h2{
    margin:0 0 6px 0;
    font-size:19px;
    color:var(--charcoal);
  }
  .overlay-card p{
    margin:0 0 18px 0;
    font-size:13px;
    color:#77705F;
  }
  .overlay-card select{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:16px;
    font-family:inherit;
  }
  .overlay-card button{
    width:100%;
    padding:11px;
    background:var(--charcoal);
    color:var(--gold-light);
    border:none;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .overlay-card button:disabled{opacity:.4;cursor:not-allowed;}
  .overlay-card button:hover:not(:disabled){background:#000;}

  /* ---------- Datumbalk ---------- */
  .date-bar{
    position:fixed;
    bottom:0;
    left:220px;
    right:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:10px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    z-index:50;
    box-shadow:0 -2px 10px rgba(0,0,0,.04);
  }
  .date-nav{
    background:var(--cream);
    border:none;
    color:var(--charcoal);
    width:28px;height:28px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    line-height:1;
  }
  .date-nav:hover{background:var(--gold-light);}
  .date-month{
    font-family:Georgia,serif;
    font-size:13px;
    font-weight:700;
    color:var(--charcoal);
    white-space:nowrap;
    flex-shrink:0;
    width:100px;
    text-transform:capitalize;
  }
  .date-strip{
    display:flex;
    gap:6px;
    overflow-x:auto;
    flex:1;
    scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .day-pill{
    flex-shrink:0;
    width:46px;
    padding:6px 0 7px 0;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    cursor:pointer;
    text-align:center;
    font-family:inherit;
    position:relative;
  }
  .day-pill .wd{
    display:block;
    font-size:10px;
    color:#9A9284;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .day-pill .num{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--charcoal);
    margin-top:1px;
  }
  .day-pill.is-today{border-color:var(--gold);}
  .day-pill.is-today .num::after{
    content:"";
    display:block;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--gold);
    margin:3px auto 0 auto;
  }
  .day-pill.is-selected{
    background:var(--charcoal);
    border-color:var(--charcoal);
  }
  .day-pill.is-selected .wd{color:var(--gold-light);}
  .day-pill.is-selected .num{color:#fff;}
  .day-pill.is-selected .num::after{background:var(--gold-light);}
  .date-today{
    background:var(--charcoal);
    color:var(--gold-light);
    border:none;
    padding:8px 14px;
    border-radius:5px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
    font-family:inherit;
  }
  .date-today:hover{background:#000;}

  @media (max-width:760px){
    .date-bar{left:0;padding:8px 12px;}
    .date-month{width:70px;font-size:11.5px;}
    .day-pill{width:38px;}
  }

  /* ---------- Overdrachtslog ---------- */
  .handover-composer{
    display:flex;
    gap:10px;
    align-items:flex-end;
    background:var(--cream);
    border-radius:6px;
    padding:14px;
    margin-bottom:24px;
  }
  .handover-composer textarea{
    flex:1;
    min-height:52px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:5px;
    padding:9px 11px;
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:#fff;
  }
  .handover-composer textarea:disabled{
    background:#F0EBE1;
    color:#B3AC9E;
  }
  .handover-composer button{
    background:var(--charcoal);
    color:var(--gold-light);
    border:none;
    padding:12px 18px;
    border-radius:5px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
  }
  .handover-composer button:disabled{
    background:#D8D2C6;
    color:#fff;
    cursor:not-allowed;
  }
  .handover-composer button:hover:not(:disabled){background:#000;}

  .handover-empty{
    font-size:13.5px;
    color:#9A9284;
    font-style:italic;
    padding:20px 0;
  }
  .handover-item{
    position:relative;
    border-left:3px solid var(--gold);
    background:var(--paper);
    border-radius:0 5px 5px 0;
    padding:11px 34px 11px 14px;
    margin-bottom:10px;
  }
  .handover-meta{
    font-size:11.5px;
    color:#9A9284;
    margin-bottom:3px;
  }
  .handover-meta strong{color:var(--charcoal);font-weight:700;margin-right:8px;}
  .handover-text{
    font-size:14px;
    color:var(--ink);
    line-height:1.5;
    white-space:pre-wrap;
  }
  .handover-del{
    position:absolute;
    top:8px;right:8px;
    background:none;
    border:none;
    color:#C4BCAC;
    font-size:13px;
    cursor:pointer;
    padding:2px 6px;
  }
  .handover-del:hover{color:#B04545;}

  /* ---------- Main ---------- */
  main{
    flex:1;
    padding:36px 48px 100px 48px;
    max-width:920px;
  }
  .page-header{
    margin-bottom:28px;
  }
  .page-header h1{
    font-size:26px;
    margin:0 0 4px 0;
    color:var(--charcoal);
    font-weight:600;
  }
  .page-header .sub{
    color:#77705F;
    font-size:14px;
  }
  .notice{
    margin-top:14px;
    background:var(--cream);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    font-size:13px;
    color:var(--ink);
    line-height:1.5;
    border-radius:0 3px 3px 0;
  }
  .edit-hint{
    font-size:12px;
    color:#9A9284;
    margin-top:10px;
    font-style:italic;
  }

  .block{
    margin-top:30px;
  }
  .block-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
  }
  .block-time{
    font-family:Georgia,serif;
    font-weight:700;
    font-size:15px;
    color:var(--charcoal);
    white-space:nowrap;
  }
  .block-name{
    font-size:12px;
    letter-spacing:.03em;
    color:#fff;
    background:var(--gold);
    padding:3px 10px;
    border-radius:2px;
    font-weight:600;
  }
  .block hr{
    border:none;
    border-top:1px solid var(--line);
    margin:8px 0 0 0;
  }
  .block-early{
    font-size:12px;
    color:#9A9284;
    font-style:italic;
    padding:8px 0 2px 0;
  }

  .task{
    display:grid;
    grid-template-columns:1fr auto;
    gap:6px 16px;
    padding:13px 0;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  .task:last-child{border-bottom:none;}
  .task-main{min-width:0;}
  .task-title{
    font-weight:600;
    font-size:14.5px;
    color:var(--charcoal);
    outline:none;
    padding:2px 4px;
    margin:-2px -4px;
    border-radius:3px;
  }
  .task-desc{
    font-size:13.5px;
    color:#57503F;
    margin-top:3px;
    line-height:1.5;
    outline:none;
    padding:2px 4px;
    margin-left:-4px;
    margin-right:-4px;
    border-radius:3px;
  }
  .task-notes{
    font-size:12.5px;
    color:#8B8477;
    margin-top:5px;
    outline:none;
    padding:2px 4px;
    margin-left:-4px;
    border-radius:3px;
    min-height:16px;
  }
  .task-notes:empty::before{
    content:"+ opmerking toevoegen";
    color:#C4BCAC;
  }
  [contenteditable="true"]:hover{
    background:rgba(176,141,87,.08);
    box-shadow:0 0 0 1px var(--gold-light);
  }
  [contenteditable="true"]:focus{
    background:#fff;
    box-shadow:0 0 0 1px var(--gold);
  }
  .locked{
    cursor:default;
  }

  .status-btn{
    justify-self:end;
    border:1px solid transparent;
    background:var(--cream);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
    transition:background .12s;
  }
  .status-btn[data-status="Open"]{background:#F1E7D6;color:#8A6A34;}
  .status-btn[data-status="Bezig"]{background:#E3EAF1;color:#42597A;}
  .status-btn[data-status="Gereed"]{background:#E5ECDF;color:#4B5A40;}
  .status-btn.status-locked{
    background:#F0EDE7 !important;
    color:#B3AC9E !important;
    text-decoration:none !important;
    cursor:not-allowed;
  }
  .status-btn.status-nvt{
    background:#EFEBE4 !important;
    color:#8B8477 !important;
    text-decoration:line-through;
  }
  .nvt-btn{
    border:1px solid var(--line);
    background:transparent;
    color:#9A9284;
    font-size:11px;
    padding:4px 8px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
  }
  .nvt-btn:hover{border-color:var(--gold);color:var(--charcoal);}
  .nvt-btn.nvt-active{
    background:#EFEBE4;
    border-color:#C9C0AF;
    color:#6E675A;
    font-weight:600;
  }
  .note-meta{
    font-size:10.5px;
    color:#B3AC9E;
    margin-top:2px;
    font-style:italic;
  }
  .sop-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    font-size:12px;
    font-weight:600;
    color:var(--charcoal);
    background:var(--cream);
    border:1px solid var(--gold-light);
    padding:5px 10px;
    border-radius:5px;
    text-decoration:none;
    font-family:Arial,sans-serif;
    width:fit-content;
  }
  .sop-link:hover{background:var(--gold-light);color:#fff;}

  .task-cl{margin-top:8px;}
  .task-cl-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--charcoal);
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    font-family:inherit;
  }
  .task-cl-toggle:hover{border-color:var(--gold);}
  .task-cl.open .task-cl-toggle{background:var(--cream);border-color:var(--gold-light);}
  .task-cl-table{
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .task-cl-row{
    display:grid;
    grid-template-columns:1fr 60px 60px;
    align-items:center;
    padding:6px 12px;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
  }
  .task-cl-row:last-child{border-bottom:none;}
  .task-cl-row div:nth-child(2),
  .task-cl-row div:nth-child(3){text-align:center;}
  .task-cl-head{
    background:var(--charcoal);
    color:#fff;

async function getPin(name){
  if(PINS[name]) return PINS[name]; // vaste pin (beheerder)
  try{
    if(window.storage){
      const res = await window.storage.get(PIN_STORAGE_PREFIX + name, false);
      if(res && res.value) return res.value;
    }
  }catch(e){}
  return null; // nog geen pin aangemaakt
}

async function savePin(name, pin){
  try{
    if(window.storage){

  }catch(e){}
}

// ---------- State & persistence ----------
let state = null;
let currentShift = "ochtend";
const STORAGE_KEY = "ur-front-office-checklist-v1";
const USER_KEY = "ur-checklist-current-user";

function cloneDefault(){
  return JSON.parse(JSON.stringify(SHIFTS));
}

async function loadUser(){
  try{
    if(window.storage){
      const res = await window.storage.get(USER_KEY, false); // persoonlijk, per apparaat/browser
      if(res && res.value){
        let parsed;
        try{ parsed = JSON.parse(res.value); }catch(e){ parsed = {name: res.value, at: Date.now()}; }
        if(parsed && parsed.name){
          const idleMin = (Date.now() - (parsed.at || 0)) / 60000;
          if(idleMin < AUTO_LOGOUT_MINUTES) return parsed.name;
        }
      }
    }
  }catch(e){ /* nog niemand ingelogd op dit apparaat */ }
  return null;
}

async function saveUser(name){
  currentUser = name;
  try{
    if(window.storage){
      await window.storage.set(USER_KEY, JSON.stringify({name, at: Date.now()}), false);
    }
  }catch(e){ /* negeren, blijft in elk geval in deze sessie bewaard */ }
}

async function touchUser(){
  if(!currentUser) return;
  try{
    if(window.storage){
      await window.storage.set(USER_KEY, JSON.stringify({name: currentUser, at: Date.now()}), false);
    }
  }catch(e){ /* negeren */ }
}

function startAutoLogout(){
  let lastActivity = Date.now();
  ["click","keydown","touchstart"].forEach(ev=>{
    document.addEventListener(ev, ()=>{ lastActivity = Date.now(); touchUser(); }, true);
  });
  setInterval(()=>{
    if(!currentUser) return;
    const idleMin = (Date.now() - lastActivity) / 60000;
    if(idleMin >= AUTO_LOGOUT_MINUTES){
      currentUser = null;
      try{ if(window.storage) window.storage.delete(USER_KEY, false); }catch(e){}
      render();
    }
  }, 60000);
}

async function loadState(){
  const fresh = cloneDefault();
  try{
    if(window.storage){
      const res = await window.storage.get(STORAGE_KEY, true); // gedeeld: iedereen ziet dezelfde checklist
      if(res && res.value){
        const saved = JSON.parse(res.value);
        Object.keys(fresh).forEach(key=>{
          const freshRev = fresh[key].rev || 1;
          const savedRev = saved[key] ? (saved[key].rev || 1) : null;
          // Nieuw tabblad, of tabblad met een nieuwere revisie: gebruik altijd de actuele data.
          if(!(key in saved) || savedRev !== freshRev){
            saved[key] = fresh[key];
          }
        });
        return saved;
      }
    }
  }catch(e){ /* nog niets opgeslagen */ }
  return fresh;
}

// ---------- Dag-log: status/opmerkingen per kalenderdag, los van de taak-tekst ----------
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const TODAY_KEY = dateKey(new Date());
// Voor nachtdiensten telt de werkdag door tot 07:00: wie om 02:00 werkt,
// vinkt af op de dag waarop de dienst begon.
function shiftDayKey(shiftKey){
  const now = new Date();
  if(shiftKey === "nacht" || shiftKey === "duty"){
    if(now.getHours() < 7){
      const d = new Date(now);
      d.setDate(d.getDate() - 1);
      return dateKey(d);
    }
  }
  return dateKey(now);
}

const dayLogCache = {}; // "date:shift" -> { taskId: {s,n,sBy,sAt} }
function dayLogKey(date, shift){ return `log:${date}:${shift}`; }

async function loadDayLog(date, shift){

const WEEKDAYS = ["zo","ma","di","wo","do","vr","za"];
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function formatDateLong(key){
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${WEEKDAYS[dt.getDay()]} ${d} ${MONTHS[m-1]}`;
}

// ---------- Stabiele taak-sleutels ----------
// Sleutel op inhoud (tijdblok + taaknaam), zodat afvinkhistorie niet verschuift
// wanneer taken worden toegevoegd, verwijderd of verplaatst.
function taskKey(blockTime, taskTitle, fallbackIdx){
  const clean = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const t = clean(taskTitle);
  if(!t) return `${clean(blockTime)}~idx${fallbackIdx}`;
  return `${clean(blockTime)}~${t}`;
}

// ---------- Tijdblok-vergrendeling: taken mogen niet te vroeg afgevinkt worden ----------
function extractTimes(str){
  if(!str) return [];
  return [...str.matchAll(/(\d{1,2}):(\d{2})/g)].map(m => parseInt(m[1],10)*60 + parseInt(m[2],10));
}
function parseShiftBounds(shiftTimeStr){
  const t = extractTimes(shiftTimeStr);
  if(t.length < 2) return null;
  let [start, end] = t;
  if(end <= start) end += 1440; // dienst loopt door middernacht
  return {start, end};
}
function parseBlockWindow(shiftBounds, blockTimeStr, nextBlockTimeStr){
  if(!shiftBounds) return null;
  const t = extractTimes(blockTimeStr);
  if(t.length === 0) return null; // niet-tijd-label (bv. "Algemene bijzonderheden") -> nooit vergrendeld
  const norm = v => v >= shiftBounds.start ? v : v + 1440;
  const start = norm(t[0]);
  let end;
  if(t.length >= 2){
    end = norm(t[1]);
    if(end < start) end += 1440;
  } else {
    const nt = extractTimes(nextBlockTimeStr);
    end = nt.length ? norm(nt[0]) : shiftBounds.end;
  }
  return {start, end};
}
function nowNormalized(shiftBounds){
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  return mins >= shiftBounds.start ? mins : mins + 1440;
}

// ---------- Rendering ----------
function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  Object.keys(state).forEach(key=>{
    const s = state[key];
    const btn = document.createElement("button");
    btn.className = "tab" + (key===currentShift ? " active" : "");
    btn.innerHTML = s.label + "<small>" + s.time + "</small>";
    btn.onclick = () => { currentShift = key; render(); };
    nav.appendChild(btn);
  });
  const hbtn = document.getElementById("handover-tab-btn");
  hbtn.classList.toggle("active", currentShift === "handover");
  hbtn.onclick = ()=>{ currentShift = "handover"; render(); };

  const sbtn = document.getElementById("sop-tab-btn");
  sbtn.classList.toggle("active", currentShift === "sop");
  sbtn.onclick = ()=>{ pendingSopId = null; currentShift = "sop"; render(); };

  const adminWrap = document.getElementById("admin-wrap");
  if(currentUser === ADMIN_NAME){
    adminWrap.style.display = "block";
    const rbtn = document.getElementById("admin-tab-btn");
    rbtn.classList.toggle("active", currentShift === "report");
    rbtn.onclick = ()=>{ currentShift = "report"; render(); };
  } else {
    adminWrap.style.display = "none";
  }
}

  document.getElementById("page-sub").textContent = "Front Office checklist — " + shift.time;
  document.getElementById("page-notice").textContent = shift.notice;

  const content = document.getElementById("content");
  content.innerHTML = "";

  const isAdminNow = currentUser === ADMIN_NAME;
  document.getElementById("page-hint").textContent = isAdminNow
    ? "Klik op een taak, omschrijving of opmerking om te bewerken. Klik op de status-knop om te wisselen tussen Open → Bezig → Gereed. Als beheerder kun jij de volgorde altijd doorbreken."
    : "Taak en omschrijving zijn alleen door Martin te bewerken. Klik op de status-knop om af te vinken, of voeg een opmerking toe. Een taak ontgrendelt pas zodra de taak erboven op Gereed staat.";

  const dayLog = await loadDayLog(selectedDate, currentShift);
  let prevDone = true; // eerste taak van de dienst is nooit vergrendeld
  const shiftBounds = parseShiftBounds(shift.time);
  const isToday = selectedDate === shiftDayKey(currentShift);
  const effNow = (isToday && shiftBounds) ? nowNormalized(shiftBounds) : null;

  shift.blocks.forEach((block, bi)=>{
    const wrap = document.createElement("div");
    wrap.className = "block";

    const head = document.createElement("div");
    head.className = "block-head";
    const time = document.createElement("div");
    time.className = "block-time";
    time.textContent = block.time;
    head.appendChild(time);
    if(block.name){
      const name = document.createElement("div");
      name.className = "block-name";
      name.textContent = block.name;
      head.appendChild(name);
    }
    wrap.appendChild(head);
    wrap.appendChild(document.createElement("hr"));

    const nextBlockTime = shift.blocks[bi+1] ? shift.blocks[bi+1].time : null;
    const timeWindow = parseBlockWindow(shiftBounds, block.time, nextBlockTime);
    const tooEarly = (effNow !== null && timeWindow !== null && effNow < timeWindow.start);
    if(tooEarly){
      const early = document.createElement("div");
      early.className = "block-early";
      early.textContent = "Nog niet aan de beurt — dit blok start later vandaag.";
      wrap.appendChild(early);
    }

    block.tasks.forEach((task, ti)=>{
      // Stabiel ID op basis van inhoud, niet positie: historie blijft kloppen
      // ook als er taken tussengevoegd of verplaatst worden.
      const taskId = taskKey(block.time, task.t, ti);
      const entry = dayLog[taskId] || {};
      const row = document.createElement("div");
      row.className = "task";

      const mainCol = document.createElement("div");
      mainCol.className = "task-main";
      const isAdmin = currentUser === ADMIN_NAME;

      const title = document.createElement("div");
      title.className = "task-title";
      title.contentEditable = isAdmin ? "true" : "false";
      if(!isAdmin) title.classList.add("locked");
      title.textContent = task.t;
      title.oninput = ()=>{ if(isAdmin){ task.t = title.textContent; scheduleSave(); } };

      const desc = document.createElement("div");
      desc.className = "task-desc";
      desc.contentEditable = isAdmin ? "true" : "false";
      if(!isAdmin) desc.classList.add("locked");
      desc.textContent = task.d || "";
      desc.oninput = ()=>{ if(isAdmin){ task.d = desc.textContent; scheduleSave(); } };

      const notes = document.createElement("div");
      notes.className = "task-notes";
      notes.contentEditable = "true";
      notes.textContent = entry.n || "";
      notes.onfocus = ()=>{ if(!currentUser) showUserOverlay(shift.dept); };
      notes.oninput = ()=>{
        entry.n = notes.textContent;
        if(entry.n.trim()){
          entry.nBy = currentUser || "Onbekend";
          entry.nAt = new Date().toLocaleString("nl-NL", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
        } else {
          entry.nBy = null; entry.nAt = null;
        }
        dayLog[taskId] = entry;
        noteMeta.textContent = entry.n.trim() ? `— ${entry.nBy}, ${entry.nAt}` : "";
        scheduleLogSave(selectedDate, currentShift);
      };

      const noteMeta = document.createElement("div");
      noteMeta.className = "note-meta";
      noteMeta.textContent = (entry.n && entry.n.trim() && entry.nBy) ? `— ${entry.nBy}, ${entry.nAt || ""}` : "";

      mainCol.appendChild(title);
      mainCol.appendChild(desc);
      mainCol.appendChild(notes);
      mainCol.appendChild(noteMeta);

      if(task.checklist){
        if(!entry.cl) entry.cl = {};
        const clWrap = document.createElement("div");
        clWrap.className = "task-cl";

        const total = task.checklist.length * 2;
        const countChecked = ()=> task.checklist.reduce((sum, _, i)=>{
          const c = entry.cl[i] || {};
          return sum + (c.ota ? 1 : 0) + (c.pms ? 1 : 0);
        }, 0);

        const toggle = document.createElement("button");
        toggle.className = "task-cl-toggle";
        toggle.type = "button";
        const setToggleLabel = ()=>{
          toggle.textContent = `${clWrap.classList.contains("open") ? "▾" : "▸"} Controlepunten OTA/PMS (${countChecked()}/${total})`;
        };

        const table = document.createElement("div");
        table.className = "task-cl-table";
        const headRow = document.createElement("div");
        headRow.className = "task-cl-row task-cl-head";
        headRow.innerHTML = `<div>Controlepunt</div><div>OTA</div><div>PMS</div>`;
        table.appendChild(headRow);

        task.checklist.forEach((label, i)=>{
          if(!entry.cl[i]) entry.cl[i] = {ota:false, pms:false};
          const row = document.createElement("div");
          row.className = "task-cl-row";
          const nameCell = document.createElement("div");
          nameCell.textContent = label;
          row.appendChild(nameCell);
          ["ota","pms"].forEach(col=>{
            const cell = document.createElement("div");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = !!entry.cl[i][col];
            cb.disabled = tooEarly && !isAdmin;
            cb.onchange = ()=>{
              entry.cl[i][col] = cb.checked;
              dayLog[taskId] = entry;
              scheduleLogSave(selectedDate, currentShift);
              setToggleLabel();
            };
            cell.appendChild(cb);
            row.appendChild(cell);
          });
          table.appendChild(row);
        });

        setToggleLabel();
        toggle.onclick = ()=>{
          clWrap.classList.toggle("open");
          table.style.display = clWrap.classList.contains("open") ? "block" : "none";
          setToggleLabel();
        };
        table.style.display = "none";

        clWrap.appendChild(toggle);
        clWrap.appendChild(table);
        mainCol.appendChild(clWrap);
      }

      if(task.sopId){
        const sopLink = document.createElement("button");
        sopLink.className = "sop-link";
        sopLink.type = "button";
        sopLink.textContent = "📄 SOP openen";
        sopLink.title = "Opent de bijbehorende procedure in de SOP Bibliotheek.";
        sopLink.onclick = ()=> openSop(task.sopId);
        mainCol.appendChild(sopLink);
      }

      const statusBtn = document.createElement("button");
      statusBtn.className = "status-btn";
      const st = entry.s || "Open";
      statusBtn.dataset.status = st;
      statusBtn.textContent = st;
      const isFo = (employeesFor(shift.dept).length > 0);
      const isNvt = entry.s === "N.v.t.";
      const seqLocked = !prevDone && !isAdmin;
      const timeLocked = tooEarly && !isAdmin;
      const locked = seqLocked || timeLocked;
      if(isNvt){
        statusBtn.classList.add("status-nvt");
        statusBtn.textContent = "N.v.t.";
      } else if(locked){
        statusBtn.classList.add("status-locked");
        statusBtn.textContent = "🔒 " + st;
      }
      statusBtn.onclick = ()=>{
        if(isNvt){
          stampEl.textContent = "Maak eerst N.v.t. ongedaan via de N.v.t.-knop.";
          setTimeout(()=>{ renderContent(); }, 1800);
          return;
        }
        if(locked){
          stampEl.textContent = timeLocked ? "Dit tijdblok is nog niet begonnen." : "Voltooi eerst de taak hierboven.";
          setTimeout(()=>{
            stampEl.textContent = (entry.s && entry.s !== "Open" && entry.sAt)
              ? (entry.sBy ? `${entry.sBy} · ${entry.sAt}` : `Afgevinkt · ${entry.sAt}`)
              : "";
          }, 1800);
          return;
        }
        if(isFo && !currentUser){
          showUserOverlay(shift.dept);
          return;
        }
        const idx = STATUS_CYCLE.indexOf(entry.s || "Open");
        const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
        entry.s = next;
        entry.sAt = new Date().toLocaleString("nl-NL", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
        entry.sBy = isFo ? currentUser : null;
        dayLog[taskId] = entry;
        scheduleLogSave(selectedDate, currentShift);
        renderContent(); // herteken zodat de volgende taak eventueel ontgrendelt
      };

      // volgende taak mag alleen ontgrendelen als deze taak Gereed of N.v.t. is
      // volgende taak ontgrendelt bij Gereed of onderbouwde N.v.t.
      prevDone = (entry.s === "Gereed" || entry.s === "N.v.t.");

      const statusCol = document.createElement("div");
      statusCol.style.display = "flex";
      statusCol.style.flexDirection = "column";
      statusCol.style.alignItems = "flex-end";
      statusCol.style.gap = "3px";

      // "Niet van toepassing" — aparte knop, reden verplicht
      const nvtBtn = document.createElement("button");
      nvtBtn.className = "nvt-btn" + (entry.s === "N.v.t." ? " nvt-active" : "");
      nvtBtn.textContent = entry.s === "N.v.t." ? "N.v.t. ✎" : "N.v.t.";
      nvtBtn.title = entry.s === "N.v.t." ? "Reden aanpassen of ongedaan maken" : "Markeer als niet van toepassing (reden verplicht)";
      nvtBtn.onclick = ()=>{
        if(timeLocked){
          stampEl.textContent = "Dit tijdblok is nog niet begonnen.";
          setTimeout(()=>{ renderContent(); }, 1800);
          return;
        }
        if(!currentUser){ showUserOverlay(shift.dept); return; }
        if(entry.s === "N.v.t."){
          const keep = prompt("Reden aanpassen (leeg laten = N.v.t. ongedaan maken):", entry.nvtReason || "");
          if(keep === null) return;
          if(keep.trim() === ""){
            entry.s = "Open"; entry.nvtReason = null; entry.sBy = null; entry.sAt = null;
          } else {
            entry.nvtReason = keep.trim();
            entry.sBy = currentUser;
            entry.sAt = new Date().toLocaleString("nl-NL", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
          }
        } else {
          const reason = prompt("Waarom is deze taak vandaag niet van toepassing?\n(Verplicht — bijv. 'geen groepsaankomsten vandaag')");
          if(reason === null) return;
          if(reason.trim() === ""){
            alert("Een reden is verplicht om een taak op N.v.t. te zetten.");
            return;
          }
          entry.s = "N.v.t.";
          entry.nvtReason = reason.trim();
          entry.sBy = currentUser;
          entry.sAt = new Date().toLocaleString("nl-NL", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
        }
        dayLog[taskId] = entry;
        scheduleLogSave(selectedDate, currentShift);
        renderContent();
      };
      const stampEl = document.createElement("div");
      stampEl.style.fontSize = "10.5px";
      stampEl.style.color = "#A79C8C";
      stampEl.style.textAlign = "right";
      stampEl.style.maxWidth = "180px";
      if(entry.s === "N.v.t." && entry.nvtReason){
        stampEl.textContent = `${entry.sBy || "Onbekend"} · ${entry.sAt || ""} — ${entry.nvtReason}`;
      } else if(entry.s && entry.s !== "Open" && entry.sAt){
        stampEl.textContent = entry.sBy ? `${entry.sBy} · ${entry.sAt}` : `Afgevinkt · ${entry.sAt}`;
      }
      const btnRow = document.createElement("div");
      btnRow.style.display = "flex";
      btnRow.style.gap = "5px";
      btnRow.style.alignItems = "center";
      btnRow.appendChild(nvtBtn);
      btnRow.appendChild(statusBtn);
      statusCol.appendChild(btnRow);
      statusCol.appendChild(stampEl);

      row.appendChild(mainCol);
      row.appendChild(statusCol);
      wrap.appendChild(row);
    });

    content.appendChild(wrap);
  });
}

// ---------- Dagoverzicht (beheer) ----------
async function loadReport(date){
  const report = {date, shifts: {}};
  for(const shiftKey in state){
    const log = await loadDayLog(date, shiftKey);
    const open = Object.values(log).filter(e => !e.s || e.s === "Open" || e.s === "Bezig").length;
    const done = Object.values(log).filter(e => e.s === "Gereed").length;
    const nvt = Object.values(log).filter(e => e.s === "N.v.t.").length;
    const notes = Object.values(log).filter(e => e.n && e.n.trim()).length;
    report.shifts[shiftKey] = {open, done, nvt, notes, log};
  }
  return report;
}

function findTaskTitle(shiftKey, taskId){
  const prefix = taskId.split("~")[0];
  for(const block of state[shiftKey].blocks){
    for(const task of block.tasks){
      if(taskKey(block.time, task.t, 0).startsWith(prefix)) return task.t;
    }
  }
  return "";
}

async function renderReport(report){
  document.getElementById("page-title").textContent = "Dagoverzicht";
  document.getElementById("page-sub").textContent = formatDateLong(report.date);
  document.getElementById("page-notice").textContent = "";
  document.getElementById("page-hint").textContent = "Alleen zichtbaar voor jou als beheerder.";

  const content = document.getElementById("content");
  content.innerHTML = "";

  for(const shiftKey in report.shifts){
    const shift = state[shiftKey];
    const {open, done, nvt, notes, log} = report.shifts[shiftKey];
    const total = open + done + nvt;
    const pctDone = total ? Math.round((done + nvt) / total * 100) : 0;
    const wrap = document.createElement("div");
    wrap.className = "report-shift";

    const head = document.createElement("div");
    head.className = "report-shift-head";
    head.innerHTML = `
      <h3>${shift.label}</h3>
      <div class="report-shift-stat"><span class="dot done"></span> ${done} Gereed &nbsp; <span class="dot nvt"></span> ${nvt} N.v.t.</div>
      <div class="report-shift-stat"><span class="dot open"></span> ${open} Open &nbsp; <span class="dot notes"></span> ${notes} ${notes === 1 ? "opmerking" : "opmerkingen"}</div>
      <div class="report-pct ${pctDone === 100 ? "pct-100" : ""}">${pctDone}<small>%</small></div>
    `;
    wrap.appendChild(head);

    const taskList = document.createElement("div");
    taskList.className = "report-task-list";
    for(const taskId in log){
      const entry = log[taskId];
      const task = document.createElement("div");
      task.className = "report-task";
      const icon = document.createElement("div");
      icon.className = "report-task-icon";
      icon.innerHTML = entry.s === "N.v.t." ? `<span class="dot nvt"></span>` : entry.s === "Gereed" ? `<span class="dot done"></span>` : `<span class="dot open"></span>`;
      const title = document.createElement("div");
      title.className = "report-task-title";
      title.textContent = findTaskTitle(shiftKey, taskId);
      task.appendChild(icon);
      task.appendChild(title);
      if(entry.s === "N.v.t." && entry.nvtReason){
        task.classList.add("has-notes");
        const reason = document.createElement("div");
        reason.className = "report-task-notes";
        reason.textContent = `N.v.t. — ${entry.nvtReason} (${entry.sBy || ""})`;
        task.appendChild(reason);
      }
      if(entry.n && entry.n.trim()){
        task.classList.add("has-notes");
        const noteEl = document.createElement("div");
        noteEl.className = "report-task-notes";
        noteEl.textContent = `${entry.n.trim()} (${entry.nBy || "onbekend"})`;
        task.appendChild(noteEl);
      }
      taskList.appendChild(task);
    }
    if(Object.keys(log).length === 0){
      const empty = document.createElement("div");
      empty.className = "report-task-notes";
      empty.style.padding = "10px 18px";
      empty.textContent = "Nog geen taken bijgewerkt op deze dag.";
      taskList.appendChild(empty);
    }
    wrap.appendChild(taskList);
    content.appendChild(wrap);
  }
}

function sendReportMail(){
  const shiftKey = currentShift;
  const shift = state[shiftKey];
  const log = dayLogCache[selectedDate + ":" + shiftKey] || {};
  const open = Object.values(log).filter(e => !e.s || e.s === "Open" || e.s === "Bezig").length;
  const done = Object.values(log).filter(e => e.s === "Gereed").length;
  const nvt = Object.values(log).filter(e => e.s === "N.v.t.").length;
  const total = open + done + nvt;
  const pctDone = total ? Math.round((done + nvt) / total * 100) : 0;

  const noteLines = Object.entries(log)
    .filter(([_, e]) => e.n && e.n.trim())
    .map(([taskId, e]) => `- ${findTaskTitle(shiftKey, taskId)}: ${e.n.trim()} (${e.nBy || "onbekend"}, ${e.nAt || ""})`)
    .join("\n");
  const nvtLines = Object.entries(log)
    .filter(([_, e]) => e.s === "N.v.t." && e.nvtReason)
    .map(([taskId, e]) => `- ${findTaskTitle(shiftKey, taskId)}: ${e.nvtReason} (${e.sBy || "onbekend"}, ${e.sAt || ""})`)
    .join("\n");

  const body =
`${shift.label} — ${formatDateLong(selectedDate)}

Gereed: ${done}/${total} (${pctDone}%)
N.v.t.: ${nvt}
Nog open: ${open}
${noteLines ? "\nOpmerkingen:\n" + noteLines : ""}${nvtLines ? "\n\nN.v.t.-redenen:\n" + nvtLines : ""}

Verzonden door: ${currentUser || "onbekend"}`;

  const subject = `${shift.label} overzicht — ${formatDateLong(selectedDate)}`;
  window.location.href = `mailto:ms@urbanresidences.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

let pendingSopId = null;

function renderSop(){
  document.getElementById("page-title").textContent = "SOP Bibliotheek";
  document.getElementById("page-sub").textContent = "Standaardprocedures — Urban Residences Rotterdam";
  document.getElementById("page-notice").textContent = "";
  document.getElementById("page-hint").textContent = "Kies een procedure hieronder, of open 'm direct vanaf een taak in de checklist.";

  const content = document.getElementById("content");
  content.innerHTML = "";

  const list = document.createElement("div");
  list.className = "sop-list";
  SOPS.forEach(sop=>{
    const item = document.createElement("button");
    item.className = "sop-list-item";
    item.innerHTML = `<span>${sop.title}</span><small>${sop.category}</small>`;
    item.onclick = ()=>{ document.getElementById("sop-" + sop.id).scrollIntoView({behavior:"smooth", block:"start"}); };
    list.appendChild(item);
  });
  content.appendChild(list);

  SOPS.forEach(sop=>{
    const doc = document.createElement("article");
    doc.className = "sop-doc";
    doc.id = "sop-" + sop.id;
    doc.innerHTML = `<div class="sop-banner">${sop.title}</div><div class="sop-sub">Urban Residences Rotterdam · ${sop.category}</div>${sop.html}`;
    content.appendChild(doc);
  });

  if(pendingSopId){
    const target = document.getElementById("sop-" + pendingSopId);

  }

function openSop(sopId){
  pendingSopId = sopId;
  currentShift = "sop";
  render();
}

const HANDOVER_DEPTS = [
  { key:"FO", label:"Front Office" },
  { key:"AD", label:"AD (Algemene Dienst)" },
  { key:"HK", label:"Housekeeping" },
  { key:"TD", label:"Technische Dienst" },
  { key:"Reservations", label:"Reservations" },
];

async function renderHandover(){
  document.getElementById("page-title").textContent = "Overdrachtslog";
  document.getElementById("page-sub").textContent = "Belangrijke punten — " + formatDateLong(selectedDate);
  document.getElementById("page-notice").textContent = "Gedeeld tussen alle afdelingen. Zet hier bijzonderheden, openstaande taken en aandachtspunten neer voor de volgende dienst.";
  document.getElementById("page-hint").textContent = "Punten zijn zichtbaar voor iedereen en blijven gekoppeld aan deze dag.";

  const content = document.getElementById("content");
  content.innerHTML = "";

  const entries = await loadHandover(selectedDate);
  const isAdmin = currentUser === ADMIN_NAME;
  const allKnownStaff = [...new Set([].concat(...Object.values(EMPLOYEE_LISTS)))];
  const canPost = isAdmin || allKnownStaff.includes(currentUser);

  HANDOVER_DEPTS.forEach(dept=>{
    const wrap = document.createElement("div");
    wrap.className = "block";

    const head = document.createElement("div");
    head.className = "block-head";
    const name = document.createElement("div");
    name.className = "block-name";
    name.textContent = dept.label;
    head.appendChild(name);
    wrap.appendChild(head);
    wrap.appendChild(document.createElement("hr"));

    const composer = document.createElement("div");
    composer.className = "handover-composer";
    const textarea = document.createElement("textarea");
    textarea.placeholder = canPost
      ? `Punt toevoegen voor ${dept.label}…`
      : "Kies eerst je naam (linksboven) om een punt toe te voegen.";
    textarea.disabled = !canPost;
    const postBtn = document.createElement("button");
    postBtn.textContent = "Toevoegen";
    postBtn.disabled = !canPost;
    postBtn.onclick = async ()=>{
      const text = textarea.value.trim();
      if(!text) return;
      if(!currentUser){ showUserOverlay("fo"); return; }
      entries.push({
        text,
        dept: dept.key,
        by: currentUser,
        at: new Date().toLocaleTimeString("nl-NL", {hour:"2-digit",minute:"2-digit"}),
      });
      handoverCache[selectedDate] = entries;
      textarea.value = "";
      await saveHandover(selectedDate);
      renderContent();
    };
    composer.appendChild(textarea);
    composer.appendChild(postBtn);
    wrap.appendChild(composer);

    const deptEntries = entries
      .map((e, i)=>({...e, _idx:i}))
      .filter(e => (e.dept || "FO") === dept.key)
      .reverse();

    const list = document.createElement("div");
    list.className = "handover-list";
    if(deptEntries.length === 0){
      const empty = document.createElement("div");
      empty.className = "handover-empty";
      empty.textContent = "Nog geen punten voor " + dept.label + ".";
      list.appendChild(empty);
    } else {
      deptEntries.forEach(entry=>{
        const item = document.createElement("div");
        item.className = "handover-item";
        const meta = document.createElement("div");
        meta.className = "handover-meta";
        meta.innerHTML = `<strong>${entry.by}</strong><span>${entry.at}</span>`;
        const txt = document.createElement("div");
        txt.className = "handover-text";
        txt.textContent = entry.text;
        item.appendChild(meta);
        item.appendChild(txt);
        if(isAdmin){
          const del = document.createElement("button");
          del.className = "handover-del";
          del.textContent = "✕";
          del.title = "Verwijderen";
          del.onclick = async ()=>{
            entries.splice(entry._idx, 1);
            handoverCache[selectedDate] = entries;
            await saveHandover(selectedDate);
            renderContent();
          };
          item.appendChild(del);
        }
        list.appendChild(item);
      });
    }
    wrap.appendChild(list);
    content.appendChild(wrap);
  });
}

function renderUserBadge(){
  const el = document.getElementById("user-badge");
  const dept = currentShift === "handover" ? "fo" : state[currentShift].dept;
  const list = employeesFor(dept);
  if(list.length === 0){
    el.innerHTML = `<span class="lbl">Naamregistratie</span><span class="name" style="color:#8B8477;font-weight:400;">n.v.t. voor deze afdeling</span>`;
    el.onclick = null;
    return;
  }
  const deptLabel = dept === "fo" ? "Front Office" : (dept === "ad" ? "Algemene Dienst" : "Housekeeping");
  if(currentUser && list.includes(currentUser)){
    el.innerHTML = `<span class="lbl">Ingelogd als</span><span class="name">${currentUser}</span><span class="switch">wisselen</span>`;
  } else {
    el.innerHTML = `<span class="lbl">${deptLabel}</span><span class="name">Kies je naam…</span>`;
  }
  el.onclick = ()=> showUserOverlay(dept);
}

function showUserOverlay(dept){
  dept = dept || (state[currentShift] && state[currentShift].dept) || "fo";
  const list = employeesFor(dept);
  const selected = list.includes(currentUser) ? currentUser : null;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="overlay-card">
      <h2>Wie ben jij?</h2>
      <p>Kies je naam en voer je pincode in. Afgevinkte taken worden aan jou gekoppeld.</p>
      <select id="user-select">
        <option value="" disabled ${!selected ? "selected" : ""}>Kies je naam…</option>
        ${list.map(n => `<option value="${n}" ${n===selected ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      <div id="pin-wrap" style="display:none;">
        <div id="pin-label" style="font-size:12px;color:#77705F;margin-bottom:6px;">Voer je pincode in:</div>
        <input type="password" id="pin-input" inputmode="numeric" maxlength="4" placeholder="Pincode (4 cijfers)" style="width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;font-family:inherit;letter-spacing:.2em;box-sizing:border-box;">
        <div id="pin-confirm-wrap" style="display:none;">
          <input type="password" id="pin-confirm" inputmode="numeric" maxlength="4" placeholder="Herhaal pincode" style="width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;font-family:inherit;letter-spacing:.2em;box-sizing:border-box;">
        </div>
        <div id="pin-error" style="display:none;color:#B04545;font-size:12px;margin-bottom:10px;"></div>
      </div>
      <button id="user-confirm" ${selected ? "" : "disabled"}>Doorgaan</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const select = overlay.querySelector("#user-select");
  const btn = overlay.querySelector("#user-confirm");
  const pinWrap = overlay.querySelector("#pin-wrap");
  const pinLabel = overlay.querySelector("#pin-label");
  const pinInput = overlay.querySelector("#pin-input");
  const pinConfirmWrap = overlay.querySelector("#pin-confirm-wrap");
  const pinConfirm = overlay.querySelector("#pin-confirm");
  const pinError = overlay.querySelector("#pin-error");

  function syncPinVisibility(){
    if(select.value){
      pinWrap.style.display = "block";
      btn.disabled = pinInput.value.length !== 4;
    } else {
      pinWrap.style.display = "none";
      pinError.style.display = "none";
      btn.disabled = true;
    }
  }
  select.onchange = async ()=>{
    pinInput.value = ""; pinError.style.display = "none";
    if(select.value){
      const existingPin = await getPin(select.value);
      if(!existingPin && select.value !== ADMIN_NAME){
        pinLabel.textContent = "Kies een pincode van 4 cijfers (jouw eigen code):";
        pinConfirmWrap.style.display = "block";
      } else {
        pinLabel.textContent = "Voer je pincode in:";
        pinConfirmWrap.style.display = "none";
      }
      pinWrap.style.display = "block";
      btn.disabled = pinInput.value.length !== 4;
    } else {
      pinWrap.style.display = "none";
      btn.disabled = true;
    }
  };
  pinInput?.addEventListener("input", ()=>{
    pinError.style.display = "none";
    const confirmVisible = pinConfirmWrap.style.display !== "none";
    btn.disabled = confirmVisible
      ? (pinInput.value.length !== 4 || pinConfirm.value.length !== 4)
      : pinInput.value.length !== 4;
  });
  pinConfirm?.addEventListener("input", ()=>{
    pinError.style.display = "none";
    btn.disabled = pinInput.value.length !== 4 || pinConfirm.value.length !== 4;
  });
  pinInput?.addEventListener("keydown", (e)=>{ if(e.key === "Enter" && !btn.disabled) btn.click(); });
  syncPinVisibility();

  btn.onclick = async ()=>{
    if(!select.value) return;
    const existingPin = await getPin(select.value);
    if(!existingPin && select.value !== ADMIN_NAME){
      // Eerste keer: pincode aanmaken
      if(pinInput.value.length !== 4){
        pinError.textContent = "Kies een pincode van precies 4 cijfers.";
        pinError.style.display = "block"; return;
      }
      if(pinInput.value !== pinConfirm.value){
        pinError.textContent = "Pincodes komen niet overeen. Probeer opnieuw.";
        pinError.style.display = "block";
        pinInput.value = ""; pinConfirm.value = ""; pinInput.focus(); return;
      }
      await savePin(select.value, pinInput.value);
    } else {
      // Verificatie
      const expected = existingPin;
      if(!expected || pinInput.value !== expected){
        pinError.textContent = "Onjuiste pincode.";
        pinError.style.display = "block";
        pinInput.value = ""; pinInput.focus(); btn.disabled = true; return;
      }
    }
    await saveUser(select.value);
    document.body.removeChild(overlay);
    render();
  };
}

function renderDateBar(){
  const strip = document.getElementById("date-strip");
  strip.innerHTML = "";
  const days = [];
  for(let i=0; i<14; i++){
    const d = new Date(windowStart);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  document.getElementById("date-month").textContent =
    MONTHS[days[0].getMonth()] + " " + days[0].getFullYear();

  days.forEach(d=>{
    const key = dateKey(d);
    const pill = document.createElement("button");
    pill.className = "day-pill" + (key===TODAY_KEY ? " is-today" : "") + (key===selectedDate ? " is-selected" : "");
    pill.innerHTML = `<span class="wd">${WEEKDAYS[d.getDay()]}</span><span class="num">${d.getDate()}</span>`;
    pill.onclick = ()=>{ selectedDate = key; renderDateBar(); if(currentShift === "report"){ loadReport(selectedDate).then(renderReport); } else { renderContent(); } };
    strip.appendChild(pill);
  });
}

document.getElementById("date-prev").onclick = ()=>{
  windowStart.setDate(windowStart.getDate() - 7);
  renderDateBar();
};
document.getElementById("date-next").onclick = ()=>{
  windowStart.setDate(windowStart.getDate() + 7);
  renderDateBar();
};
document.getElementById("date-today").onclick = ()=>{
  selectedDate = TODAY_KEY;
  const d = new Date(); d.setDate(d.getDate()-6);
  windowStart = d;
  renderDateBar();
  renderContent();
};

function render(){
  renderTabs();
  renderContent();
  renderUserBadge();
  renderDateBar();
}

function render(){
  if(currentShift === "handover"){
    renderHandover();
  } else if(currentShift === "report") {
    loadReport(selectedDate).then(renderReport);
  } else if(currentShift === "sop") {
    renderSop();
    renderTabs();
  } else {
    renderTabs();
    renderContent();
    renderUserBadge();
    renderDateBar();
    renderSendBar();
  }
}

function renderSendBar(){
  const wrap = document.getElementById("send-bar-wrap");
  if(currentShift === "report"){
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "block";
  const btn = document.getElementById("send-report-btn");
  btn.textContent = `Verstuur ${state[currentShift].label.toLowerCase()}-overzicht`;
  btn.href = "#";
  btn.onclick = sendReportMail;
}

(async ()=>{
  currentUser = await loadUser();
  state = await loadState();
  render();
  startAutoLogout();
  setInterval(()=>{
    if(currentShift !== "handover") renderContent();
  }, 60000);
})();
